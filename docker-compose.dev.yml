# DEV ONLY — hot-reload override. Do not use for a pilot or any shared host.
#
# Convenient local defaults: source bind-mounts, JWT optional, Qdrant without
# an API key, SQLite (no Postgres), ports on 127.0.0.1 only.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Dashboard: http://127.0.0.1:5173
# API:       http://127.0.0.1:8000
#
# Docker socket is not mounted. If you added a skill that needs it:
#   docker compose --profile docker-sock \
#     -f docker-compose.dev.yml -f docker-compose.docker-sock.yml up

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: hermes-backend-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      ENV: development
      ALLOW_LOCAL_AUTH_FALLBACK: "1"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LLM_API_BASE: ${LLM_API_BASE:-https://openrouter.ai/api/v1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      LLM_MODEL: ${LLM_MODEL:-ollama/llama3}
      QDRANT_HOST: qdrant
      OBSIDIAN_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount backend source for hot-reload
      - ./backend:/app/backend
      - ./hermes_audit_verify.py:/app/hermes_audit_verify.py
      - ./.env:/app/.env
    depends_on:
      - qdrant
    networks:
      - hermes-dev-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hermes-frontend-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - hermes-dev-net

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: hermes-qdrant-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    # DEV ONLY: no API key. Pilot/prod compose requires QDRANT_API_KEY.
    # Image has no shell — backend rag.py handles connection errors on startup.
    networks:
      - hermes-dev-net

networks:
  hermes-dev-net:
    driver: bridge

volumes:
  qdrant_dev_data:
