apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-backend
  labels:
    app: hermes
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hermes
      component: backend
  template:
    metadata:
      labels:
        app: hermes
        component: backend
    spec:
      containers:
      - name: backend
        image: jarvis-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://jarvis:password@hermes-db:5432/hermes"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-frontend
  labels:
    app: hermes
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hermes
      component: frontend
  template:
    metadata:
      labels:
        app: hermes
        component: frontend
    spec:
      containers:
      - name: frontend
        image: jarvis-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-sandbox
  labels:
    app: hermes
    component: sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hermes
      component: sandbox
  template:
    metadata:
      labels:
        app: hermes
        component: sandbox
    spec:
      containers:
      - name: sandbox
        image: jarvis-sandbox:latest
        imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-db
  labels:
    app: hermes
    component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
      component: db
  template:
    metadata:
      labels:
        app: hermes
        component: db
    spec:
      containers:
      - name: db
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: jarvis
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_DB
          value: hermes
