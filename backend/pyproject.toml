[project]
name = "hermes-backend"
version = "1.5.0"
description = "Jarvis personal assistant backend (Hermes)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-telegram-bot>=20.3",
    "httpx>=0.24.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "websockets>=11.0",
    "qdrant-client>=1.13.2",
    "fastembed>=0.2.0",
    "matplotlib>=3.7.0",
    "docker>=6.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.32",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.95.0",
    "todoist-api-python>=2.1.3",
    "pypdf>=6.21.4,<7",
    "apscheduler>=3.10.0",
    "sqlalchemy>=2.0",
    "yfinance>=0.2.0",
    "ta>=0.10.0",
    "stripe>=15.5.0",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]
# Optional: PostgreSQL backend
# Activate with: uv sync --group postgres
postgres = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]
# Optional: CCXT crypto market data (open-source, no API key for public endpoints)
# Activate with: uv sync --group market-ccxt
market-ccxt = [
    "ccxt>=4.0",
]
# Optional: Alpaca US equity market data (requires free Alpaca account)
# Activate with: uv sync --group market-alpaca
market-alpaca = [
    "alpaca-py>=0.8",
]

[tool.uv]
# ponytail: cap majors; remaining crit/high need pillow 13 / cryptography 50 / filelock 4
constraint-dependencies = [
    "anyio>=4.16.0",
    "certifi>=2026.11.20",
    "cryptography>=49,<50",
    "fsspec>=2026.6.0,<2027",
    "httplib2>=0.32.1,<0.33",
    "pillow>=12.3.0,<13",
    "pyasn1>=0.6.5,<0.7",
    "starlette>=1.3.1,<1.4",
    "urllib3>=2.8.0,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["..", "."]
