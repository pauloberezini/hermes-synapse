# Non-blocking: reports known Python CVEs, never fails the PR.
name: pip-audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pip-audit:
    name: pip-audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit frozen lockfile
        run: |
          uv export --frozen --no-hashes --no-annotate -o /tmp/reqs.txt
          grep -E '^[A-Za-z0-9_.-]+==' /tmp/reqs.txt | grep -v ';' > /tmp/pins.txt
          uvx pip-audit -r /tmp/pins.txt --disable-pip --no-deps --progress-spinner off
