name: Hermes CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Backend Tests
        run: uv run pytest
        env:
          PYTHONPATH: ..
          OPENROUTER_API_KEY: "mock-openrouter-key"
          TELEGRAM_BOT_TOKEN: "mock-bot-token"
          TELEGRAM_CHAT_ID: "123456789"
          LLM_MODEL: "google/gemini-2.5-flash"

  frontend-test:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Application
        run: npm run build

  docs-build:
    name: VitePress docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install and build docs
        working-directory: docs
        run: |
          npm ci
          npm run docs:build

      - name: Check SEO artifacts
        run: |
          test -f docs/.vitepress/dist/robots.txt
          test -f docs/.vitepress/dist/sitemap.xml
          test -f docs/.vitepress/dist/og-image.png
          grep -q 'application/ld+json' docs/.vitepress/dist/index.html
          grep -q 'og:image' docs/.vitepress/dist/index.html
          grep -q 'canonical' docs/.vitepress/dist/index.html
          grep -q 'https://pauloberezini.github.io/hermes-synapse/' docs/.vitepress/dist/sitemap.xml
          grep -q 'https://pauloberezini.github.io/hermes-synapse/guide/security.html' docs/.vitepress/dist/sitemap.xml
          ! grep -q 'https://pauloberezini.github.io/guide/' docs/.vitepress/dist/sitemap.xml
